
name: Python CI

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt

      - name: Run pytest
        run: python -m pytest -v

      - name: Run Ruff
        run: ruff check .

  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build Docker image
        run: docker build -t inventory-management:ci .

      - name: Run pytest inside Docker
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE/tests:/app/tests:ro" \
            inventory-management:ci \
            sh -c "python -m pip install --no-cache-dir -r requirements.txt && python -m pytest -v"
